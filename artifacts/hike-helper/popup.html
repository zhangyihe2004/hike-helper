<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hi课助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1 class="brand"><img class="brand__logo" src="logo.png" alt="Hi课助手" width="600" height="113" draggable="false"></h1>
  </header>
  <main>
    <label class="switch-row" for="enabled">
      <span id="status" role="status" aria-live="polite">未启用</span>
      <span class="switch">
        <input id="enabled" type="checkbox" role="switch" aria-label="启用Hi课助手" disabled>
        <span class="track" aria-hidden="true"></span>
      </span>
    </label>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
