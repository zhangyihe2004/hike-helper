<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="../extension_icon32.png">
  <title>课堂视频</title>
  <link rel="stylesheet" href="original/jydH5Player.css">
  <link rel="stylesheet" href="shell.css">
</head>
<body data-background="white">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="course-info">
        <h1 id="courseName">课堂视频</h1>
        <div class="course-meta">
          <p id="teacherInfo" hidden>授课老师：<span id="teacherName"></span></p>
          <p id="classInfo" hidden>授课班级：<span id="className"></span></p>
        </div>
      </div>
      <fieldset class="theme-switch" aria-label="页面外观">
        <label class="theme-option">
          <input type="radio" name="pageTheme" value="white" aria-label="浅色模式" checked>
          <span class="theme-choice">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4"></path></svg>
            浅色
          </span>
        </label>
        <label class="theme-option">
          <input type="radio" name="pageTheme" value="black" aria-label="深色模式">
          <span class="theme-choice">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.8 13.3A8.9 8.9 0 0 1 10.7 3.2a9 9 0 1 0 10.1 10.1Z"></path></svg>
            深色
          </span>
        </label>
      </fieldset>
    </div>
  </header>
  <main class="playback-stage">
    <div class="course-page"><div id="h5PlayerId"></div></div>
  </main>
  <script src="../vendor/jquery.min.js"></script>
  <script src="original/jydH5Player.js"></script>
  <script src="../core.js"></script>
  <script src="media.js"></script>
  <script src="boot.js"></script>
</body>
</html>
